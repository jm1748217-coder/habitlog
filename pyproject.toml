[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitlog"
version = "0.1.0"
description = "A local-first command-line habit tracker."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
habitlog = "habitlog.cli:main"

[tool.setuptools]
packages = ["habitlog"]
